name: Update README cards

# Generates every profile card as a static SVG and commits it to this repo.
# Nothing is fetched when someone views the profile — GitHub serves the committed
# files. The GitHub API is only ever called from inside this workflow, so the cards
# cannot be rate limited the way a per-request hosted instance can.

on:
  schedule:
    - cron: "17 6 * * *" # daily, off the hour to dodge peak scheduler contention
  workflow_dispatch:
  push:
    # Regenerate immediately when the card configuration itself changes.
    # Path-scoped on purpose: the SVG commit below must not retrigger this run.
    paths:
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

env:
  # Shared palette, so every card stays visually consistent. Change it once here.
  THEME: "theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=1F6FEB&text_color=C9D1D9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN by default. If the optional CARDS_TOKEN secret exists, the
          # push is attributed to a human account instead — see "Keeping the daily
          # schedule alive" in the workflow notes below.
          token: ${{ secrets.CARDS_TOKEN || github.token }}

      # ---- Overview ------------------------------------------------------------
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=percentile&ring_color=58A6FF&${{ env.THEME }}"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.THEME }}"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- Activity ------------------------------------------------------------
      # Streak is a separate project (github-stats-extended has no streak card), but
      # it ships its own composite action, so it runs here rather than on Vercel.
      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077 # v1.7.0
        with:
          # Every colour is set explicitly: this card ignores `theme` for the section
          # dividers, which otherwise stay #E4E2E2 and glare white on a dark card.
          # disable_animations follows the streak project's own Actions example --
          # a committed static SVG must not need an animation to become visible.
          options: "user=${{ github.repository_owner }}&hide_border=true&disable_animations=true&background=0D1117&stroke=30363D&ring=58A6FF&fire=FF6B6B&currStreakNum=C9D1D9&sideNums=C9D1D9&currStreakLabel=58A6FF&sideLabels=58A6FF&dates=8B949E"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: profile/snake.svg?palette=github-dark&color_snake=#58A6FF






      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A, not profile/*.svg: a glob only matches files that still exist, so
          # removing a card step above would strand its SVG in the repo forever.
          git add -A profile/
          git diff --staged --quiet && echo "No card changes." && exit 0
          git commit -m "chore: refresh README stat cards"
          git push
