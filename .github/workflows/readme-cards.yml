name: Update README cards

# Generates the profile stat cards as static SVGs and commits them to this repo.
# Nothing is fetched when someone views the profile — GitHub serves the committed
# files. The GitHub API is only ever called from inside this workflow, authenticated
# with GITHUB_TOKEN (5000 req/hr), so the cards cannot be rate limited the way a
# per-request Vercel instance can.

on:
  schedule:
    - cron: "17 6 * * *" # daily, off the hour to dodge peak scheduler contention
  workflow_dispatch:
  push:
    # Regenerate immediately when the card configuration itself changes.
    # Path-scoped on purpose: the SVG commit below must not retrigger this run.
    paths:
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=percentile&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=1F6FEB&text_color=C9D1D9&ring_color=58A6FF"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Hammunition
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=Hammunition&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=1F6FEB&text_color=C9D1D9"
          path: profile/pin-hammunition.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Hammunition Hill
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=hammunition-hill&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=1F6FEB&text_color=C9D1D9"
          path: profile/pin-hammunition-hill.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && echo "No card changes." && exit 0
          git commit -m "chore: refresh README stat cards"
          git push
